<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBlink Clone</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/favicon.ico">
</head>
<body>
    <div class="container">
        <h1>Welcome to ChatBlink Clone</h1>
        <form id="registerForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="displayName" placeholder="Display Name" required>
            <select id="age" required>
                <option value="">Select Age</option>
                <!-- Generate options dynamically -->
            </select>
            <select id="gender" required>
                <option value="">Select Gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>
            <input type="number" id="height" placeholder="Height (cm)" required>
            <input type="number" id="weight" placeholder="Weight (kg)" required>
            <select id="bodyType" required>
                <option value="">Select Body Type</option>
                <!-- Add body type options -->
            </select>
            <select id="sexuality" required>
                <option value="">Select Sexuality</option>
                <option value="Straight">Straight</option>
                <option value="Gay">Gay</option>
                <option value="Bisexual">Bisexual</option>
            </select>
            <select id="hairColor" required>
                <option value="">Select Hair Color</option>
                <!-- Add hair color options -->
            </select>
            <select id="hairStyle" required>
                <option value="">Select Hair Style</option>
                <!-- Add hair style options -->
            </select>
            <select id="eyeColor" required>
                <option value="">Select Eye Color</option>
                <!-- Add eye color options -->
            </select>
            <select id="ethnicity" required>
                <option value="">Select Ethnicity</option>
                <!-- Add ethnicity options -->
            </select>
            <input type="text" id="location" placeholder="City, Country" required>
            <textarea id="hobbies" placeholder="Hobbies" required></textarea>
            <button type="submit">Register</button>
        </form>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
